# ============================================================================
#  MESSKONFIGURATION - nur fuer die Edge-Frage, NICHT fuer den Betrieb
# ============================================================================
#  Aufruf:
#      $env:TRADEX_CONFIG = "config\backtest_edge.yaml"
#      .\.venv\Scripts\python.exe scripts\run_backtest.py --symbol MNQ_PROXY --save
#
#  WARUM ES DIESE DATEI GIBT
#  -------------------------
#  Das Risikobudget begrenzt die bezahlbare Stopweite: Budget geteilt durch
#  den Tickwert des Instruments. Ist es zu klein, scheitern Setups an der
#  Positionsgroesse, bevor die Regel ueberhaupt beurteilt werden konnte - bei
#  10.000 USD und 0,25 % waren das 25 USD, also nur 50 Ticks bei MNQ, und
#  ueber 2023-2026 scheiterten daran 149 von rund 310 vollstaendigen Setups.
#
#  Diese Datei beantwortet deshalb genau EINE Frage: Hat die Regelmechanik
#  einen statistischen Edge, wenn das Risikobudget nicht der begrenzende
#  Faktor ist? Sie sagt NICHTS darueber, mit welchem Konto man das handeln
#  kann - das ist eine getrennte Frage und wird ueber default.yaml beantwortet.
#
#  EINZIGER UNTERSCHIED ZU default.yaml: risk.account_size.
#  Alle Schwellenwerte der Strategie bleiben unveraendert. Ein Test prueft das
#  (tests/test_config_and_persistence.py) - ohne ihn wuerde die Datei mit der
#  Zeit unbemerkt auseinanderlaufen und eine zweite Regelfassung werden.
#
#  Der Wert MUSS ueber dem in default.yaml liegen, sonst kehrt sich der Zweck
#  der Datei um. Genau das drohte am 25.08.2026: default.yaml stieg von 10.000
#  auf 100.000 (Groesse des NinjaTrader-Simulationskontos Sim101), womit die
#  hier stehenden 25.000 ploetzlich das ENGERE Budget gewesen waeren - eine
#  Messkonfiguration, die knapper rechnet als der Betrieb, misst das Gegenteil
#  dessen, wofuer sie gebaut wurde.
# ============================================================================
# ============================================================================
#  TradeX - zentrale Konfiguration
# ============================================================================
#  ARCHITEKTUR-INVARIANTE 4 (Spec §29):
#  Jeder Schwellenwert des Systems steht in dieser Datei. Im Code darf keine
#  einzige Magic Number stehen. Was hier nicht steht, existiert nicht.
#
#  Alle Werte unten sind STARTWERTE (Hypothesen), die in Phase 4 per Backtest
#  untersucht werden. Sie werden hier NICHT als "richtig" behauptet.
# ============================================================================

version: 1

app:
  language: de
  display_timezone: Europe/Berlin
  host: 127.0.0.1
  port: 8765
  log_level: INFO

data:
  parquet_dir: data/parquet
  database: data/tradex.db
  log_dir: logs
  default_symbol: MNQ
  base_timeframe: 1m          # aus dieser TF werden alle hoeheren aggregiert
  # Ab wie vielen zusammenhaengenden fehlenden Bars gilt es als Datenluecke.
  # Einzelne fehlende Minuten bedeuten nur, dass gerade nicht gehandelt wurde -
  # bei Futures normal. Erst laengere Loecher sind ein Datenproblem.
  min_gap_bars: 5

timeframes:
  # Spec §5 - konfigurierbar. Reihenfolge = Analysereihenfolge (gross -> klein).
  htf: ["4h", "1h"]
  intermediate: ["15m", "5m"]
  entry: ["1m"]

analysis:

  # ---------------------------------------------------------------- Volatilitaet
  volatility:
    atr_period: 14
    atr_method: wilder          # wilder | sma
    volume_sma_period: 20
    # Mindestanzahl geschlossener Bars, bevor ein TF ueberhaupt analysiert wird.
    min_bars_required: 60

  # -------------------------------------------------------------------- Swings
  # Swing High(n): high[i] == max(high[i-n .. i+n]) und strikt groesser als
  # mindestens ein Nachbar je Seite. Bestaetigung braucht n Bars -> der Lag
  # ist explizit und wird pro Swing als `confirmed_at_index` mitgeloggt.
  swings:
    default_strength: 2
    per_timeframe:
      "1m": 3
      "5m": 2
      "15m": 2
      "1h": 2
      "4h": 2
    max_tracked: 300

  # ---------------------------------------------------------------- Structure
  # BOS bullish   = Close ueber letztem bestaetigten Swing High.
  # MSS bullish   = Close ueber letztem bestaetigten Swing High, waehrend der
  #                 letzte abgeschlossene Leg ein Lower Low erzeugt hat.
  # Immer Close-basiert, nie Docht-basiert.
  structure:
    confirm_on: close           # close | wick
    min_break_ticks: 1
    max_events: 300

  # --------------------------------------------------------------------- FVG
  # Bullish FVG ueber Bars (i-2, i-1, i):  low[i] > high[i-2]
  #   Zone = [high[i-2], low[i]]
  # Bearish FVG:                           high[i] < low[i-2]
  #   Zone = [high[i], low[i-2]]
  fvg:
    min_size_ticks: 4
    min_atr_mult: 0.15
    mitigation_threshold: 0.5   # Anteil der Zone, dessen Durchhandeln = MITIGATED
    mitigation_on: close        # close | wick
    max_age_bars: 500
    max_tracked: 300
    skip_roll_boundary: true    # FVGs ueber Contract-Roll-Grenzen sind Phantome

  # ------------------------------------------------------------ Displacement
  # Bullish Displacement an Bar i - ALLE Bedingungen muessen gelten:
  #   range[i] > range_atr_mult * ATR
  #   body[i] / range[i] > body_ratio_min
  #   close[i] > high[i-1]                     (falls require_break_prev_extreme)
  #   volume[i] > volume_mult * SMA(volume)    (nur Gate wenn volume_is_gate)
  displacement:
    range_atr_mult: 1.5
    body_ratio_min: 0.6
    require_break_prev_extreme: true
    volume_mult: 1.5
    volume_is_gate: false       # Volumen ist nicht garantiert verfuegbar ->
                                # setzt nur das Flag `volume_confirmed`
    # strength in [0,1], rein informativ in Phase 2 - KEIN Filter.
    strength_weights:
      range: 0.5
      body: 0.3
      volume: 0.2
    strength_range_cap_atr_mult: 4.0    # ab hier zaehlt range als 1.0
    strength_volume_cap_mult: 4.0       # ab hier zaehlt volume als 1.0

  # --------------------------------------------------------------- Liquiditaet
  liquidity:
    equal_tolerance_ticks: 3    # Swings innerhalb dieser Spanne = Equal Highs/Lows
    equal_min_count: 2
    equal_lookback_swings: 30
    include_swing_levels: true
    include_session_levels: true
    include_prior_day: true
    include_prior_week: true
    max_tracked: 300

  # -------------------------------------------------------------------- Sweep
  # Sell-Side Sweep (bullish):
  #   low[i] < pool.price - min_penetration_ticks
  #   UND Close zurueck ueber pool.price innerhalb max_reclaim_bars Bars.
  sweep:
    min_penetration_ticks: 2
    max_reclaim_bars: 3
    reclaim_on: close           # close | wick
    max_tracked: 200

  # ---------------------------------------------------------------- HTF Bias
  # Score in [-1, +1]. |score| < neutral_band -> NEUTRAL.
  bias:
    timeframe_weights:
      "4h": 0.6
      "1h": 0.4
    component_weights:
      structure: 0.5
      fvg: 0.25
      liquidity: 0.25
    neutral_band: 0.20

# ============================================================================
#  STRATEGIE (Phase 3) - Spec §6-§9
# ============================================================================
#  Die Pflichtkette lautet:
#      HTF Bias -> Liquidity Sweep -> Displacement -> FVG -> Retracement
#               -> Lower-Timeframe Confirmation (MSS) -> Entry
#
#  Fehlt auch nur EINE Bedingung, entsteht kein Trade (Spec §9). Der Bot
#  ergaenzt nichts und "erraet" nichts.
# ============================================================================

strategy:
  enabled: true

  # Auf welcher Ebene sich das Setup entwickelt und wo es bestaetigt wird (Spec §5).
  setup_timeframe: "5m"
  confirmation_timeframe: "1m"

  # Zeitfenster der Kette, jeweils in Bars des SETUP-Timeframes.
  # Sie sind der Grund, warum ein Setup verfaellt statt ewig offen zu bleiben:
  # ein Sweep von vor drei Stunden hat mit dem jetzigen Impuls nichts mehr zu tun.
  sweep_max_age_bars: 20          # Sweep -> Displacement
  displacement_max_age_bars: 6    # Displacement muss zeitnah zum Sweep liegen
  fvg_max_age_bars: 60            # FVG -> Retracement
  confirmation_max_age_bars: 20   # Retracement -> MSS (in Confirmation-Bars)

  # Ab welchem Fuellgrad der FVG-Zone das Retracement als erfolgt gilt.
  # 0.0 = Beruehrung genuegt. Spec §7 Schritt 5 verlangt ausdruecklich, dass
  # nicht blind beim ersten Beruehren gekauft wird - deshalb ist danach noch
  # die MSS-Bestaetigung Pflicht.
  retracement_min_fill: 0.0

  # Ungueltigkeitsregeln.
  invalidate_beyond_sweep: true   # Kurs faellt unter das Sweep-Tief -> Setup tot
  invalidate_on_bias_flip: true   # HTF-Richtung dreht -> Setup tot
  max_active_setups: 4

# ----------------------------------------------------------------- Stop Loss
# Spec §11: kein willkuerlicher Abstand, sondern ein Kurs mit Bedeutung.
#
# Der Einstieg erfolgt auf den MSS NACH dem Ruecklauf. Der Punkt, an dem genau
# diese Idee kippt, ist das Extrem des Ruecklaufs - deshalb ist er der Anker.
# Das Sweep-Extrem waere inhaltlich der Ursprung des Setups, liegt zum
# Einstiegszeitpunkt aber eine ganze Impulsbewegung entfernt und macht den Stop
# systematisch weit.
#
# WELCHER ANKER TATSAECHLICH BESSER IST, MUSS DER BACKTEST IN PHASE 4 ZEIGEN.
# `retracement` ist gesetzt, weil es zum Einstiegsmodell passt - nicht, weil es
# auf irgendwelchen Daten besser ausgesehen haette.
stops:
  anchor: retracement             # retracement | sweep | swing | fvg
  buffer_atr_mult: 0.25
  buffer_min_ticks: 4
  min_stop_ticks: 8               # darunter ist der Stop im Rauschen
  max_stop_atr_mult: 6.0          # muss default.yaml entsprechen - siehe Kopf

# --------------------------------------------------------------- Take Profit
# Spec §12: kein fester Dollarbetrag. Ziel ist die naechste unberuehrte
# Liquiditaet in Handelsrichtung - dorthin wird der Kurs gezogen.
targets:
  mode: liquidity                 # liquidity | r_multiple
  max_candidates: 6               # so viele Level werden nach oben durchsucht
  fallback_r_multiple: 3.0        # wenn gar keine Liquiditaet gefunden wird
  require_untapped: true

# ------------------------------------------------------------ Handelsfenster
# Spec §13: Der Bot ueberwacht rund um die Uhr, handelt aber nur unter
# passenden Bedingungen. Eine erreichte Uhrzeit ist ausdruecklich KEIN Grund
# fuer einen Trade - dies sind reine Filter, keine Ausloeser.
trading_windows:
  enabled: true
  sessions: ["london", "ny_am", "ny_pm"]
  min_atr_ticks: 8                # zu ruhig: Ziele werden nicht erreicht
  max_atr_ticks: 400              # zu wild: Stops werden zu Zufall

# ============================================================================
#  RISIKO (Phase 3) - Spec §10
# ============================================================================
#  Bewusst sehr konservativ voreingestellt. Die Positionsgroesse wird immer
#  aus Kontogroesse, Risiko pro Trade und Stopabstand berechnet - nie gesetzt.
# ============================================================================

risk:
  enabled: true
  account_size: 250000.0          # abweichend von default.yaml - siehe Kopf.
                                  # Muss GROESSER als dort sein (dort 100.000).
  risk_per_trade_pct: 0.25        # 625 USD - Budget ist hier nie der Engpass
  max_daily_loss_pct: 1.0
  max_trades_per_day: 3
  max_open_positions: 1
  min_rr: 2.0                     # Spec §12: schlechtes CRV wird abgelehnt
  max_spread_ticks: 2
  max_slippage_ticks: 2
  max_position_size: 5            # harte Obergrenze (Spec §24)

# ============================================================================
#  BACKTEST (Phase 4) - Spec §19
# ============================================================================
#  Diese Werte entscheiden, wie ehrlich das Ergebnis ist. Sie sind bewusst
#  pessimistisch: ein Backtest, der guenstiger fuellt als die Wirklichkeit,
#  liefert genau die Zahlen, die man sehen will - und damit keine.
#
#  Die Analyse selbst laeuft ueber denselben Pfad wie Replay und spaeter Live
#  (`MarketContext.on_base_bar`). Der Backtest fuegt AUSSCHLIESSLICH die
#  Ausfuehrung hinzu, nie eine zweite Regelauslegung.
# ============================================================================

backtest:
  # Das Signal entsteht am SCHLUSS der Bestaetigungsbar. Zu diesem Kurs kann
  # man real nicht mehr kaufen - gefuellt wird auf der naechsten Bar.
  entry_fill: next_bar_open       # next_bar_open | signal_close

  # Liegen Stop UND Ziel in derselben Bar, sagen OHLC-Daten nicht, was zuerst
  # kam. Angenommen wird der schlechtere Fall.
  same_bar_resolution: stop_first  # stop_first | target_first

  entry_slippage_ticks: 1.0
  stop_slippage_ticks: 1.0        # Stop = Market-Order, rutscht.
                                  # Ziel = Limit-Order: fuellt zum Kurs oder gar nicht.
  commission_per_contract: 0.74   # USD je Kontrakt und Round Turn

  max_holding_bars: 480           # Zeitstop in Basis-Bars (0 = aus)

  # Hoechstabstand zwischen Signalbar und Fuellbar, in Basis-Intervallen.
  # Normal sind genau zwei: eine Bar, bis die Signalbar als geschlossen gilt,
  # eine bis zur Fuellung. Mehr heisst Luecke - Feiertag, Handelspause,
  # fehlende Daten. Eine Order darueber hinweg zu fuellen erfindet einen
  # Einstieg, den es nicht gab (gemessen an echten Daten: ein Signal vom
  # 19.06.2023 11:58 CT waere sonst 5 Stunden spaeter gefuellt worden).
  max_signal_age_bars: 2

  # Unter dieser Trade-Anzahl weist der Bericht seine Kennzahlen ausdruecklich
  # als nicht belastbar aus.
  min_trades_for_significance: 30

  # Der letzte Teil des Zeitraums wird getrennt ausgewertet. Weichen die beiden
  # Abschnitte stark voneinander ab, ist das Ergebnis an den Zeitraum angepasst
  # und nicht an den Markt.
  out_of_sample_fraction: 0.3

  max_report_trades: 500          # Obergrenze fuer Trades/Equity je Bericht

# ============================================================================
#  Ab hier: Platzhalter fuer spaetere Phasen. Bewusst schon dokumentiert,
#  damit die Werte nie im Code landen.
# ============================================================================

patterns:        # Musterstatistik ueber die Trades eines Backtests
  # Zulaessige Rate falscher Funde (Benjamini-Hochberg). Ohne Korrektur liefert
  # eine Auswertung mit zwanzig Untergruppen im Schnitt eine "signifikante",
  # auch wenn gar kein Effekt existiert.
  alpha: 0.05

  # Ab dieser Gruppengroesse wird ueberhaupt getestet. Kleinere Gruppen stehen
  # im Bericht, zaehlen aber nicht als Hypothese.
  min_trades: 30

  # So viele Trades braucht dieselbe Gruppe im hinteren Abschnitt, damit ihr
  # Vorzeichen dort als Gegenprobe zaehlt.
  min_out_of_sample_trades: 10

execution:       # Phase 5/8/9 - Spec §18
  mode: paper_auto            # analysis_only | paper_manual | paper_auto
                              # | live_manual | live_auto
  live_trading_enabled: false # Spec §24: Live standardmaessig deaktiviert

live:            # im Backtest ohne Wirkung - siehe Begruendung bei broker:
  nt8_history_days: 3
  nt8_history_timeout_seconds: 30.0

broker:          # Phase 8 - im Backtest ohne Wirkung, aber siehe unten
  enabled: true
  # Diese Datei misst nur; ein Broker wird hier nie gebaut. Der Block steht
  # trotzdem da, weil test_messkonfiguration_weicht_nur_beim_konto_ab die
  # beiden Konfigurationen Feld fuer Feld vergleicht - und der Vergleich ist
  # nur dann eine Aussage, wenn er wirklich alles umfasst. Beim Nachziehen von
  # default.yaml gehoert der Wert hier mit nachgezogen.

news:            # Spec §14/§15 - Sperrfenster um Wirtschaftstermine
  enabled: false
  store: data/news/events.jsonl
  min_impact: high
  countries: [USD]
  block_before_minutes: 15
  block_after_minutes: 15
  assumed_time_extra_minutes: 15
  day_only_policy: ignore
  on_missing_data: warn

# Instrument- und Session-Definitionen.
#
# Kontraktspezifikationen verifiziert gegen CME Group (Stand 2026-08):
#   MNQ  Micro E-mini Nasdaq-100 : Tick 0.25 Indexpunkte = $0.50 ; Multiplikator $2  / Punkt
#   NQ   E-mini Nasdaq-100       : Tick 0.25 Indexpunkte = $5.00 ; Multiplikator $20 / Punkt
#
# Alle Uhrzeiten in exchange_timezone (America/Chicago). DST wird via zoneinfo
# aufgeloest - deshalb hier KEINE UTC-Offsets hartkodieren.

version: 1

defaults:
  exchange: CME
  exchange_timezone: America/Chicago
  currency: USD

  # Globex-Handelswoche: So 17:00 CT bis Fr 16:00 CT,
  # taegliche Wartungspause 16:00-17:00 CT.
  trading_hours:
    week_open:  { weekday: 6, time: "17:00" }   # 6 = Sonntag (Python: Mo=0 ... So=6)
    week_close: { weekday: 4, time: "16:00" }   # 4 = Freitag
    daily_break: { start: "16:00", end: "17:00" }
    daily_reset: "17:00"                        # Beginn des Globex-Handelstages

  # Analyse-Sessions (Spec §5, §13). Sessions duerfen Mitternacht ueberspannen.
  #
  # WICHTIG: Die Fenster muessen den Handelstag LUECKENLOS abdecken.
  # Bleibt eine Zeitspanne unbelegt, gilt dort session=CLOSED, waehrend der
  # Markt laut Handelszeiten offen ist. Das erzeugt Phantom-Datenluecken und
  # falsche Session-Grenzen bei der Liquiditaetsbildung.
  # Deshalb beginnt "asia" bereits um 17:00 (Globex-Open) und nicht erst um
  # 18:00 - die erste Stunde nach der Wartungspause gehoert zur Asia-Phase.
  # Die Invariante "session == CLOSED genau dann, wenn Markt geschlossen"
  # wird von tests/test_data_layer.py geprueft.
  sessions:
    asia:    { start: "17:00", end: "02:00", crosses_midnight: true }
    london:  { start: "02:00", end: "08:30", crosses_midnight: false }
    ny_am:   { start: "08:30", end: "12:00", crosses_midnight: false }
    ny_pm:   { start: "12:00", end: "16:00", crosses_midnight: false }

  # Regular Trading Hours = Kassahandelszeiten des Nasdaq-100 (09:30-16:00 ET).
  rth: { start: "08:30", end: "15:00" }

  # Quartalszyklus fuer Equity-Index-Futures.
  contract_months: [H, M, U, Z]   # Maerz, Juni, September, Dezember

instruments:
  MNQ:
    name: "Micro E-mini Nasdaq-100"
    databento_dataset: GLBX.MDP3
    databento_continuous: "MNQ.c.0"     # volumenbasierter Roll, Front Month
    tick_size: 0.25                     # Indexpunkte
    tick_value: 0.50                    # USD pro Tick
    point_value: 2.00                   # USD pro Indexpunkt
    contract_size: 1
    price_decimals: 2

  NQ:
    name: "E-mini Nasdaq-100"
    databento_dataset: GLBX.MDP3
    databento_continuous: "NQ.c.0"
    tick_size: 0.25
    tick_value: 5.00
    point_value: 20.00
    contract_size: 1
    price_decimals: 2

  # Nasdaq-100-Index als CFD von Dukascopy - kostenlose Historie ab 2011,
  # ohne Konto und ohne Zahlungsmittel.
  #
  # BEWUSST ein eigenes Symbol: Das sind ECHTE Marktdaten, aber vom INDEX,
  # nicht vom MNQ-Future. Der Future notiert mit Auf-/Abschlag zum Index und
  # rollt quartalsweise; das Volumen ist bei Dukascopy eine Aktivitaetskennzahl
  # statt gehandelter Kontrakte. Die Intraday-Struktur ist praktisch identisch,
  # weshalb sich die Regelmechanik hier gut pruefen laesst - fuer die Freigabe
  # von Echtgeld braucht es aber echte MNQ-Daten.
  #
  # Tick- und Punktwerte sind bewusst die von MNQ: gemessen wird, wie sich die
  # MNQ-Strategie auf Nasdaq-100-Kursverlauf verhaelt. Der Importer rundet die
  # Kurse dafuer auf das 0,25er-Raster.
  MNQ_PROXY:
    name: "Nasdaq-100 Index CFD (Dukascopy) - Naeherung fuer MNQ"
    databento_dataset: GLBX.MDP3
    databento_continuous: "MNQ.c.0"
    dukascopy_symbol: "USATECHIDXUSD"
    tick_size: 0.25
    tick_value: 0.50
    point_value: 2.00
    contract_size: 1
    price_decimals: 2
    # Der CFD folgt NICHT exakt den CME-Zeiten. Aus einem Monat Daten gemessen:
    # letzte Bar vor der Pause 15:14 CT, erste danach 17:06 CT. Ohne diese
    # Ueberschreibung meldet die Integritaetspruefung die normale Handelspause
    # des Instruments taeglich als Datenluecke.
    trading_hours:
      daily_break: { start: "15:15", end: "17:06" }
    # ny_pm endet entsprechend frueher - sonst waere das Session-Hoch/Tief aus
    # einem Zeitraum gebildet, fuer den es gar keine Kurse gibt.
    sessions:
      ny_pm: { start: "12:00", end: "15:15", crosses_midnight: false }

  # S&P-500-Index als CFD von Dukascopy. Zweites Instrument fuer dieselben
  # Regeln (Phase 4b, Multi-Instrument).
  #
  # WARUM EIN ZWEITES INSTRUMENT: Die Strategien laufen unveraendert auf
  # mehreren Symbolen. Das ist der einzige Hebel, der die Trade-Anzahl linear
  # erhoeht, OHNE eine Regel anzufassen - und damit der einzige, der die
  # Stichprobe vergroessert, ohne die Aussage zu veraendern.
  #
  # Tick- und Punktwerte sind die des MES (Micro E-mini S&P 500), analog zu
  # MNQ_PROXY: gemessen wird, wie sich dieselbe Strategie auf einem zweiten
  # Index verhaelt, bei vergleichbarer Kontraktgroesse.
  #
  # ACHTUNG: S&P und Nasdaq sind stark korreliert. Zwei Instrumente liefern
  # deshalb NICHT die doppelte unabhaengige Stichprobe - die Vertrauensbaender
  # schrumpfen langsamer als die Trade-Anzahl waechst.
  MES_PROXY:
    name: "S&P-500 Index CFD (Dukascopy) - Naeherung fuer MES"
    databento_dataset: GLBX.MDP3
    databento_continuous: "MES.c.0"
    dukascopy_symbol: "USA500IDXUSD"
    tick_size: 0.25
    tick_value: 1.25
    point_value: 5.00
    contract_size: 1
    price_decimals: 2
    # Derselbe Anbieter, dieselbe Handelspause wie beim Nasdaq-CFD.
    trading_hours:
      daily_break: { start: "15:15", end: "17:06" }
    sessions:
      ny_pm: { start: "12:00", end: "15:15", crosses_midnight: false }

  # Synthetische Daten zum Pruefen der Oberflaeche und der Detektoren, solange
  # noch keine echte Historie vorliegt. BEWUSST ein eigenes Symbol: so kann
  # generierter Kursverlauf niemals mit echten Marktdaten verwechselt werden,
  # und die Oberflaeche zeigt dafuer eine deutliche Warnung an.
  MNQ_DEMO:
    name: "SYNTHETISCHE DEMODATEN - keine Marktdaten"
    databento_dataset: GLBX.MDP3
    databento_continuous: "MNQ.c.0"
    tick_size: 0.25
    tick_value: 0.50
    point_value: 2.00
    contract_size: 1
    price_decimals: 2

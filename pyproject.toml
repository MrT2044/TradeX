[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradex"
version = "0.1.0"
description = "Regelbasiertes, backtestbares Trading-System fuer Nasdaq-100 Futures (MNQ/NQ)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pywebview>=5.1",
]

[project.optional-dependencies]
databento = ["databento>=0.34"]
# ACHTUNG, Herkunft: auf PyPI liegt `ibapi` 9.81.1.post1 - hochgeladen von
# einem Dritten, nicht von IBKR. Der Inhalt ist IBKRs eigener Quelltext, der
# Stand ist 2020. Die AKTUELLE Fassung (10.x) gibt es nur ueber den
# TWS-API-Installer von https://interactivebrokers.github.io/:
#     .\.venv\Scripts\python.exe -m pip install "C:\TWS API\source\pythonclient"
#
# 9.81 genuegt fuer diese Anbindung - der Adapter erkennt die Signaturen zur
# Laufzeit (`error` ohne errorTime, `cancelOrder` ohne OrderCancel,
# `eTradeOnly` vorhanden). Wer die neuere Fassung installiert, braucht nichts
# zu aendern. Importiert wird die Bibliothek ausschliesslich in
# `tradex/broker/ibkr/`, ein Test haelt die Grenze fest.
ibkr = ["ibapi>=9.81"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
tradex = "tradex.shell:main"

[tool.setuptools.packages.find]
include = ["tradex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:tradex.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF023: __slots__ folgt bei Bars der OHLC-Semantik, nicht dem Alphabet.
ignore = ["E501", "RUF023"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["tradex"]
